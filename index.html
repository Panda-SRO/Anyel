  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#081824;--surface:#0e2735;--surface-2:#0b2130;--ink:#e9f3f8;--muted:#93b0c1;

  }}
  :root[data-theme="dark"]{

    --deep:#040f18;--deep-2:#0a2b42;--accent:#ff7d5c;--aqua:#25c3c0;
    --line:rgba(233,243,248,0.14);--line-strong:rgba(233,243,248,0.24);--shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;color-scheme:light dark;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  a{color:inherit;}
  ::selection{background:rgba(255,106,69,0.25);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .wrap{max-width:1160px;margin:0 auto;padding-inline:22px;}
  .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-block:13px;color:#eaf3f8;}

  .brand .name span{display:block;font-size:10.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--aqua);margin-top:3px;}
  .nav-links{display:none;gap:26px;font-size:14.5px;color:#bcd3e0;}
  .nav-links a{text-decoration:none;padding-block:6px;border-bottom:2px solid transparent;}
  .nav-links a:hover{color:#fff;border-color:var(--accent);}
  @media (min-width:860px){.nav-links{display:flex;}}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;font-family:var(--sans);font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);}
  .btn-wa{background:var(--wa);color:#053;}
  .btn-wa:hover{background:#20c05d;}

  .nav .btn-wa{padding:10px 16px;}

  .admin-btn.on{color:#0b3;border-color:var(--wa);background:rgba(37,211,102,0.15);}

  .hero{position:relative;background:linear-gradient(160deg,var(--deep) 0%, var(--deep-2) 100%);color:#eaf3f8;overflow:hidden;}
  .hero-waves{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:120px;opacity:.5;}
  .hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;padding-block:74px 90px;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--aqua);font-weight:700;font-size:12.5px;letter-spacing:0.14em;text-transform:uppercase;}
  .hero-eyebrow::before{content:"";width:26px;height:1px;background:var(--aqua);}
  .hero h1{font-size:clamp(38px,5.6vw,66px);margin-top:20px;max-width:14ch;}
  .hero h1 em{font-style:italic;color:var(--accent);}
  .hero .lead{margin-top:22px;font-size:clamp(16px,1.6vw,19px);color:#c4dae7;max-width:46ch;}
  .hero-ctas{display:flex;gap:13px;flex-wrap:wrap;margin-top:32px;}
  .hero-badges{display:flex;gap:22px;flex-wrap:wrap;margin-top:40px;}
  .hero-badges div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#bcd3e0;}
  .hero-badges svg{color:var(--aqua);flex-shrink:0;}

  .filter.active{background:var(--deep);color:#eaf3f8;border-color:var(--deep);}

  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease;}

  .card-media{position:relative;height:172px;background:linear-gradient(150deg, color-mix(in srgb,var(--aqua) 22%, var(--surface)), color-mix(in srgb,var(--accent) 16%, var(--surface)));display:flex;align-items:center;justify-content:center;overflow:hidden;}

  .card-media .art{position:absolute;inset:0;width:100%;height:100%;}

  .price{font-family:var(--serif);font-weight:600;font-size:26px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .price small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-top:5px;}
  .btn-order{background:var(--wa);color:#053;border:none;font-family:var(--sans);font-weight:700;font-size:13.5px;padding:11px 15px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, background .15s ease;text-decoration:none;}
  .btn-order:hover{transform:translateY(-1px);background:#20c05d;}
  .card-actions{display:flex;gap:8px;align-items:center;}
  .btn-share{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong);width:40px;height:40px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease, color .15s ease, border-color .15s ease;flex-shrink:0;padding:0;}

  .market-note{margin-top:26px;font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:flex-start;}
  .market-note svg{color:var(--accent);flex-shrink:0;margin-top:2px;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:15px;grid-column:1/-1;}

  .fresh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:820px){.fresh-grid{grid-template-columns:1fr;}}
  .fresh{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;}
  .fresh .ic{width:52px;height:52px;border-radius:13px;background:var(--deep);color:#eaf3f8;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .fresh h3{font-size:20px;margin-bottom:9px;}
  .fresh p{font-size:14.5px;color:var(--muted);}

  .steps{background:var(--deep);color:#eaf3f8;}
  .steps .sec-head h2{color:#fff;}
  .steps .sec-head p{color:#bcd3e0;}
  .steps .eyebrow{color:var(--aqua);}
  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:820px){.steps-grid{grid-template-columns:1fr;}}
  .step{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;}
  .step .n{font-family:var(--serif);font-size:30px;color:var(--accent);font-weight:600;}
  .step h3{color:#fff;font-size:20px;margin:12px 0 8px;}
  .step p{font-size:14.5px;color:#bcd3e0;}

  .contact-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:26px;}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr;}}

  .info-row span{font-size:14px;color:var(--muted);}
  .hours .h{display:flex;justify-content:space-between;font-size:14px;padding-block:8px;border-bottom:1px solid var(--line);}
  .hours .h:last-child{border-bottom:none;}
  .hours .h .d{color:var(--muted);}
  .hours .h .t{font-weight:600;font-variant-numeric:tabular-nums;}

  .cta-card p{color:#c4dae7;font-size:15px;margin-bottom:22px;}
  .pill-note{font-size:12.5px;color:var(--aqua);margin-top:14px;}

  .foot-links a{text-decoration:none;display:block;font-size:14px;line-height:2;}

  .wa-float{position:fixed;right:20px;bottom:20px;z-index:60;width:60px;height:60px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,0.3);animation:pulse 2.6s ease-out infinite;transition:transform .18s ease;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#eaf3f8;padding:14px 22px;border-radius:11px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,0.35);z-index:120;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .admin-overlay{position:fixed;inset:0;background:rgba(4,15,24,0.62);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto;}
  .admin-panel{background:var(--surface);color:var(--ink);width:100%;max-width:780px;border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,0.45);border:1px solid var(--line);}

  .a-input,.a-select,.a-text{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:15px;}

  .btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:var(--sans);}

  .btn-dark{background:var(--deep);color:#fff;border:none;padding:11px 17px;border-radius:9px;font-weight:600;cursor:pointer;font-family:var(--sans);font-size:14px;}

  .btn-del{background:none;border:1px solid var(--line-strong);color:#d9503b;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--sans);}
  .err{color:#d9503b;font-size:13.5px;margin-top:4px;}
  .ok{color:#1a9d54;font-size:13.5px;}
  .admin-row{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px;display:grid;grid-template-columns:96px 1fr;gap:15px;}
  @media (max-width:560px){.admin-row{grid-template-columns:1fr;}}
  .admin-thumb{width:96px;height:96px;border-radius:11px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;}

  .r-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .r-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px;}
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);}
  .admin-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;position:sticky;bottom:0;background:var(--surface);padding-top:14px;border-top:1px solid var(--line);}
  .save-status{font-size:13.5px;color:var(--muted);}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .admin-user{font-size:13px;color:var(--muted);}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function svgToUrl(svg){ return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fitFont(ctx,text,weight,serif,max,startPx){ let px=startPx; do{ ctx.font=weight+' '+px+'px '+(serif?'Georgia, serif':'"DM Sans", system-ui, sans-serif'); if(ctx.measureText(text).width<=max) break; px-=4; }while(px>26); return px; }
/* genera una imagen (poster) del producto para compartir */
async function makeShareImage(p){
  try{ if(document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,800))]); }catch(e){}
  const W=1080,H=1080,pad=70; const c=document.createElement('canvas'); c.width=W;c.height=H; const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0f3c5c'); g.addColorStop(1,'#08283f'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const panelY=96, panelH=620, panelW=W-2*pad;
  roundRect(ctx,pad,panelY,panelW,panelH,44); ctx.fillStyle='#eef4f7'; ctx.fill();
  try{
    let im, cover=false;
    if(p.img){ im=await loadImg(p.img); cover=true; }
    else { let svg=art(p).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '); im=await loadImg(svgToUrl(svg)); }
    ctx.save(); roundRect(ctx,pad,panelY,panelW,panelH,44); ctx.clip();
    if(cover){ const s=Math.max(panelW/im.width,panelH/im.height); const dw=im.width*s,dh=im.height*s; ctx.drawImage(im,pad+(panelW-dw)/2,panelY+(panelH-dh)/2,dw,dh); }
    else { const bw=panelW-120,bh=panelH-120; const s=Math.min(bw/im.width,bh/im.height); const dw=im.width*s,dh=im.height*s; ctx.drawImage(im,pad+(panelW-dw)/2,panelY+(panelH-dh)/2,dw,dh); }
    ctx.restore();
  }catch(e){}
  if(p.fresh){ ctx.fillStyle='#ff6a45'; roundRect(ctx,pad+30,panelY+30,280,64,32); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 30px "DM Sans", system-ui, sans-serif'; ctx.textAlign='center'; ctx.fillText('FRESCO DEL DÍA',pad+170,panelY+72); }
  ctx.textAlign='left';
  const nameY=panelY+panelH+120; const npx=fitFont(ctx,p.n,'700',false,W-2*pad,88); ctx.fillStyle='#ffffff'; ctx.font='700 '+npx+'px "DM Sans", system-ui, sans-serif'; ctx.fillText(p.n,pad,nameY);
  ctx.fillStyle='#ff6a45'; ctx.font='700 78px Georgia, serif'; ctx.fillText(CLP(p.p)+' /kg',pad,nameY+96);
  ctx.fillStyle='#12a8a5'; ctx.font='700 32px "DM Sans", system-ui, sans-serif'; ctx.fillText('🐟 PESCADERÍA OJIER · Fresco del mar',pad,H-64);
  return c.toDataURL('image/jpeg',0.9);
}
async function shareProduct(name){
  const key=String(name||'').trim().toLowerCase();
  const p=products.find(x=>String(x.n||'').trim().toLowerCase()===key) || {n:name,p:0,d:''};
  const text='🐟 '+p.n+' — '+CLP(p.p)+'/kg en Pescadería Ojier.'+(p.d?('\n'+p.d):'')+'\n\nHaz tu pedido por WhatsApp 👉 '+SITE_URL;
  // 1) intentar compartir con la imagen adjunta (celulares compatibles)
  let file=null;
  try{ const dataUrl=await makeShareImage(p); const blob=await (await fetch(dataUrl)).blob(); file=new File([blob], (slug(p.n)||'producto')+'.jpg', {type:'image/jpeg'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:text}); return; }
    catch(err){ if(err && err.name==='AbortError') return; }
  }
  // 2) compartir solo texto + enlace (con vista previa por Open Graph)
  if(navigator.share){
    try{ await navigator.share({title:'Pescadería Ojier — '+p.n, text:text, url:SITE_URL}); return; }
    catch(err){ if(err && err.name==='AbortError') return; }
  }
  // 3) escritorio: copiar y abrir WhatsApp
  try{ await navigator.clipboard.writeText(text); toast('Enlace copiado. ¡Pégalo donde quieras compartir! ✓'); }catch(e){}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');
}

function slug(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function newId(n){ return (slug(n)||'prod')+'-'+Math.random().toString(36).slice(2,7); }

document.addEventListener('click', e=>{
  const sh = e.target.closest && e.target.closest('.btn-share');
  if(sh){ e.preventDefault(); shareProduct(sh.getAttribute('data-n')); return; }
  const f = e.target.closest && e.target.closest('.filter');
  if(f){ activeCat=f.getAttribute('data-cat'); document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===f)); const grid=document.getElementById('grid'); if(grid) grid.innerHTML=gridHTML(activeCat==='Todos'?products:products.filter(p=>p.c===activeCat)); return; }

  if(e.target.id==='admin-overlay' || e.target.id==='admin-close'){ closeAdmin(); return; }
  if(e.target.id==='btn-login'){ doLogin(); return; }
  if(e.target.id==='btn-forget'){ try{ localStorage.removeItem('ojier_admin_email'); }catch(err){} renderPanel(); return; }
  if(e.target.id==='btn-logout'){ doLogout(); return; }
  if(e.target.id==='btn-add'){ addRow(); return; }
  if(e.target.id==='btn-restore'){ restoreDefaults(); return; }
  if(e.target.id==='btn-save'){ saveAll(); return; }
  const del=e.target.closest && e.target.closest('.btn-del'); if(del){ const i=+del.getAttribute('data-i'); const it=adminData[i]; if(it && it.id && fromDB) deletedIds.push(it.id); adminData.splice(i,1); renderEditor(); return; }
  const pick=e.target.closest && e.target.closest('.admin-thumb-btn'); if(pick){ const fi=pick.parentNode.querySelector('input[type=file]'); if(fi) fi.click(); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.target.id==='login-pass'||e.target.id==='login-email')){ e.preventDefault(); doLogin(); } });
document.addEventListener('input', e=>{
  const el=e.target; if(!adminData || !el.getAttribute) return; const f=el.getAttribute('data-f'); if(f==null) return; const i=+el.getAttribute('data-i'); if(!adminData[i]) return;
  if(f==='p') adminData[i].p=Math.max(0, parseInt(el.value||'0',10)||0);
  else if(f==='fresh') adminData[i].fresh=el.checked;
  else adminData[i][f]=el.value;
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.type==='file' && el.getAttribute('data-i')!=null){
    const i=+el.getAttribute('data-i'); const file=el.files&&el.files[0]; if(!file||!adminData[i]) return;
    resizeImage(file,800,0.58).then(u=>{ adminData[i].img=u; renderEditor(); }).catch(()=>toast('No se pudo procesar la imagen.'));
  }
});
function resizeImage(file,maxDim,q){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); try{res(c.toDataURL('image/jpeg',q));}catch(err){rej(err);} }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

function authErr(code){ const m={'auth/invalid-email':'El correo no es válido.','auth/user-disabled':'Este usuario está deshabilitado.','auth/user-not-found':'No existe ese usuario.','auth/wrong-password':'Contraseña incorrecta.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión. Revisa tu internet.'}; return m[code]||'No se pudo iniciar sesión.'; }
async function doLogin(){
  const em=document.getElementById('login-email'), pa=document.getElementById('login-pass'), er=document.getElementById('login-err'), bt=document.getElementById('btn-login');
  if(!em||!pa) return; er.hidden=true; bt.disabled=true; bt.textContent='Entrando…';
  const email=em.value.trim();
  try{ await fb.signInWithEmailAndPassword(fb.auth, email, pa.value); try{ localStorage.setItem('ojier_admin_email', email); }catch(e){} }
  catch(ex){ er.textContent=authErr(ex&&ex.code); er.hidden=false; bt.disabled=false; bt.textContent='Entrar'; }
}

function restoreDefaults(){

  let added=0;
  DEFAULT_PRODUCTS.forEach(dp=>{ if(!have[dp.n.trim().toLowerCase()]){ adminData.push({id:'', n:dp.n, c:dp.c, t:dp.t, p:dp.p, d:dp.d, fresh:!!dp.fresh, _new:true}); added++; } });
  renderEditor();
  status(added ? ('Se agregaron '+added+' producto(s) base. Revisa y pulsa “Guardar y publicar”.') : 'Ya tienes todos los productos base en la lista.');
}

async function saveAll(){
  if(!adminData) return;
  for(let i=0;i<adminData.length;i++){ if(!String(adminData[i].n||'').trim()){ status('Falta el nombre en un producto (fila '+(i+1)+').'); return; } if(!(adminData[i].p>0)){ status('Falta un precio válido en “'+(adminData[i].n||('fila '+(i+1)))+'”.'); return; } }
  const bt=document.getElementById('btn-save'); if(bt) bt.disabled=true;
  status('Guardando…');
  try{
    const batch = fb.writeBatch(fb.db); let changes=0;
    adminData.forEach((p,i)=>{
      const id = p.id || newId(p.n);
      const data = { n:String(p.n).trim(), c:p.c||'Pescados', t:p.t||'fish', p:parseInt(p.p,10)||0, d:String(p.d||'').trim(), o:i };
      if(p.fresh) data.fresh=true;
      if(p.img) data.img=p.img;
      const key = prodKey({n:data.n,c:data.c,t:data.t,p:data.p,d:data.d,fresh:!!p.fresh,img:p.img||'',o:i});
      if(!p.id || originalKeys[id]!==key){ batch.set(fb.doc(fb.db,'productos',id), data); changes++; }
      p.id=id;
    });
    (deletedIds||[]).forEach(id=>{ batch.delete(fb.doc(fb.db,'productos',id)); changes++; });
    if(changes===0){ status('No hay cambios que guardar.'); if(bt) bt.disabled=false; return; }
    await Promise.race([ batch.commit(), new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})), 20000)) ]);
    deletedIds=[];
    products = adminData.map((p,i)=>({ id:p.id, o:i, n:String(p.n).trim(), c:p.c, t:p.t, p:parseInt(p.p,10)||0, d:String(p.d||'').trim(), fresh:!!p.fresh, img:p.img||undefined }));
    fromDB=true; snapshotOriginals(); repaintGrid();
    status('¡Guardado! Los cambios ya están publicados. ✓');
  }catch(ex){
    console.error(ex);
    const code=ex&&ex.code;
    if(code==='permission-denied') status('⚠️ Permiso denegado: falta PUBLICAR las reglas de seguridad de Firestore. Publícalas y vuelve a intentar.');
    else if(code==='timeout') status('⚠️ Está tardando demasiado. Revisa tu internet y que hayas PUBLICADO las reglas de Firestore, y toca Guardar de nuevo.');
    else if(code==='unavailable') status('Sin conexión con la base de datos. Revisa tu internet e intenta de nuevo.');
    else status('No se pudo guardar'+(code?' ('+code+')':'')+'. Intenta de nuevo.');
  } finally { const b2=document.getElementById('btn-save'); if(b2) b2.disabled=false; }
}

/* ================== FIREBASE (carga tolerante a fallos) ================== */
(async function initFirebase(){
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod, fsMod, authMod] = await Promise.all([
      import(V+'firebase-app.js'),
      import(V+'firebase-firestore.js'),
      import(V+'firebase-auth.js')
    ]);
    const application = appMod.initializeApp(firebaseConfig);
    const db = fsMod.getFirestore(application);
    const auth = authMod.getAuth(application);
    fb = {
      db, auth,
      collection:fsMod.collection, getDocs:fsMod.getDocs, doc:fsMod.doc,
      setDoc:fsMod.setDoc, deleteDoc:fsMod.deleteDoc, writeBatch:fsMod.writeBatch,
      signInWithEmailAndPassword:authMod.signInWithEmailAndPassword, signOut:authMod.signOut, onAuthStateChanged:authMod.onAuthStateChanged
    };
    fbState='ready';
    { const ov=document.getElementById('admin-overlay'); if(ov && !ov.hidden) renderPanel(); }
    // cargar productos guardados
    try{
      const snap = await fb.getDocs(fb.collection(db,'productos'));
      if(!snap.empty){
        products = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(a.o||0)-(b.o||0));
        fromDB=true;
        repaintGrid();
      }
    }catch(ex){ console.warn('No se pudieron leer productos:', ex); }
    // estado de sesión
    fb.onAuthStateChanged(auth, u=>{
      currentUser=u;
      const b=document.getElementById('open-admin'); if(b) b.classList.toggle('on', !!u);
      if(u){ adminData = products.map(p=>Object.assign({},p)); deletedIds=[]; snapshotOriginals(); }
      else { adminData = null; deletedIds=[]; }
      const ov=document.getElementById('admin-overlay'); if(ov && !ov.hidden) renderPanel();
    });
  }catch(ex){ console.warn('Firebase no disponible; mostrando catálogo por defecto.', ex); fb=null; fbState='failed'; const ov=document.getElementById('admin-overlay'); if(ov && !ov.hidden) renderPanel(); }
})();
</script>
